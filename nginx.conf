server {
	listen 8080;
	listen [::]:8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;
	# Built pages live at /about/index.html, so /about redirects to /about/.
	# A relative Location keeps that redirect working behind any port mapping or proxy.
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location / {
		try_files $uri $uri/ $uri.html =404;
		# HTML must revalidate so a new deploy shows up right away.
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	# Astro's content-hashed JS, CSS, and fonts never change under the same name.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		access_log off;
	}

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
}
